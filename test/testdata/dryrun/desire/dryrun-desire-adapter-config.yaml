# Adapter deployment configuration for a named Desire transport dry run.
adapter:
  name: dryrun-desire-adapter
  version: "0.1.0"

clients:
  hyperfleet_api:
    timeout: 10s
    retry_attempts: 3
    retry_backoff: exponential
  broker:
    subscription_id: "dryrun-sub"
    topic: "cluster-events"
  kubernetes:
    api_version: "v1"

stores:
  desired-memory:
    type: memory

transports:
  remote-primary:
    type: remote
    store: desired-memory
