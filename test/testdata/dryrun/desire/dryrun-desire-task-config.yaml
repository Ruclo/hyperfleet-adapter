# Task configuration for a named Desire transport dry run.
params:
  - name: clusterId
    source: event.id
    type: string
    required: true

resources:
  - name: cluster_config
    transport:
      client: remote-primary
      desire:
        target_cluster: "{{ .clusterId }}"
        resource: configmaps
    manifest:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ .clusterId }}-config"
        namespace: default
      data:
        transport: desire
    discovery:
      namespace: default
      by_name: "{{ .clusterId }}-config"
